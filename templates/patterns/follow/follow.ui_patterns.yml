follow:
  label: Newsletter & Follow us
  description: "Allow the user to have access to the subscription to the proposed newsletter (s), and the links to the social network accounts of the entity."
  links:
    - "https://www.systeme-de-design.gouv.fr/composants-et-modeles/composants/lettre-d-information-et-reseaux-sociaux"
  settings:
    title_tag:
      type: select
      label: HTML tag for title
      options:
        h2: h2
        h3: h3 (default)
        h4: h4
        h5: h5
        h6: h6
      default: h3
    follow_title_tag:
      type: select
      label: "HTML tag for 'Follow us' title"
      options:
        h2: h2
        h3: h3 (default)
        h4: h4
        h5: h5
        h6: h6
      default: h3
  fields:
    social_title:
      type: render
      label: Social networks title
      preview: "Follow us <br> on social networks"
    newsletter_title:
      type: text
      label: Newsletter title
      preview: "Subscribe to our newsletter"
    newsletter_body:
      type: render
      label: Newsletter description
      preview: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas varius tortor nibh, sit amet tempor nibh finibus et."
    newsletter:
      type: render
      label: Newsletter button
      preview:
        type: pattern
        id: button
        fields:
          label: Subscribe
          url: "https://example.com"
    social:
      type: render
      label: Social networks links
      description: "A list of button components."
      preview:
        - type: pattern
          id: button
          fields:
            title: Follow on Facebook
          settings:
            url: "https://facebook.com"
            social: facebook
        - type: pattern
          id: button
          fields:
            title: Follow on Twitter
          settings:
            url: "https://twitter.com"
            social: twitter-x
        - type: pattern
          id: button
          fields:
            title: Follow on Instagram
          settings:
            url: "https://instagram.com"
            social: instagram
        - type: pattern
          id: button
          fields:
            title: Follow on LinkedIn
          settings:
            url: "https://www.linkedin.com"
            social: linkedin
        - type: pattern
          id: button
          fields:
            title: Follow on Youtube
          settings:
            url: "https://www.youtube.com"
            social: youtube
        - type: pattern
          id: button
          fields:
            title: Follow on Threads
          settings:
            url: "https://www.threads.com"
            social: threads
        - type: pattern
          id: button
          fields:
            title: Follow on TikTok
          settings:
            url: "https://www.tiktok.com"
            social: tiktok
        - type: pattern
          id: button
          fields:
            title: Follow on Dailymotion
          settings:
            url: "https://www.dailymotion.com"
            social: dailymotion
        - type: pattern
          id: button
          fields:
            title: Follow on Mastodon
          settings:
            url: "https://www.mastodon.com"
            social: mastodon
