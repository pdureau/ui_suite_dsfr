link:
  label: Link
  description: "Allows navigation between a page and other content within the same page, the same site or external."
  links:
    - "https://www.systeme-de-design.gouv.fr/elements-d-interface/composants/lien"
  category: Link
  variants:
    default:
      label: Medium
    sm:
      label: Small
    lg:
      label: Large
  settings:
    title:
      type: token
      label: Tilte attribute
      description: "'- new window' suffix will automatically be added for external links."
      preview: Simple Link title
    url:
      type: url
      label: URL
      description: The link URL. Optional.
      preview: "/"
    target:
      type: select
      label: Target attribute.  "Blank" will automatically be set for external links.
      options:
        self: Self
        blank: Blank
        parent: Parent
        top: Left
      preview: self
    external:
      type: boolean
      label: External?
      description: Is the link targeting an external URL?
      preview: false
    tooltip:
      type: textfield
      label: Tooltip
      description: Hidden by default and displayed when hovering over. https://www.systeme-de-design.gouv.fr/elements-d-interface/composants/infobulle/
      preview: Lorem [...] elit ut
    link_id:
      type: token
      label: Link ID
      description: "Used by the tooltip. Must start with a letter. Randomly generated if empty."
    force_internal:
      type: boolean
      label: Force as internal
      description: Link will be diplayed as internal, with class 'fr-link'.
    icon_position:
      type: select
      label: Icon position
      options:
        left: Left
        right: Right
      preview: left
    icon:
      type: select
      label: Icon
      options:
        fr-icon-account-circle-fill: account circle fill
