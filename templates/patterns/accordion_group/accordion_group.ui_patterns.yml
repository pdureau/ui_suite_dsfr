accordion_group:
  label: Accordion group
  description: "A grouping of accordions."
  links:
    - "https://www.systeme-de-design.gouv.fr/elements-d-interface/composants/accordeon"
  category: Accordion
  settings:
    grouped:
      type: boolean
      label: Group accordions?
      default_value: true
  fields:
    accordions:
      type: render
      label: Accordions
      description: A list of 'accordion' components.
      preview:
        - type: pattern
          id: accordion
          fields:
            title: Accordion 1
            content:
              type: html_tag
              tag: p
              value: Accordion 1 content
        - type: pattern
          id: accordion
          fields:
            title: Accordion 2
            content:
              type: html_tag
              tag: p
              value: Accordion 2 content
        - type: pattern
          id: accordion
          fields:
            title: Accordion 3
            content:
              type: html_tag
              tag: p
              value: Accordion 3 content
